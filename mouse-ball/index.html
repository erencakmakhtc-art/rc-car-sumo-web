<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Mouse at the Ball</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1b120c; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; background: #1b120c; }
      #ld { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, #4a2c16 0%, #1b120c 70%); transition: opacity .35s; }
      #ld h1 { margin: 0; font: 400 clamp(26px, 6vw, 58px)/1.1 "Baskerville", "Palatino Linotype", Georgia, serif; letter-spacing: .12em; color: #f1d9a5; text-shadow: 0 2px 0 #000; text-align: center; }
      #ld p { margin: 10px 0 26px; font: italic 400 clamp(13px, 2.2vw, 20px)/1.2 "Baskerville", Georgia, serif; color: #c9a36a; }
      #bar { width: min(56vw, 380px); height: 6px; border-radius: 3px; background: rgba(241, 217, 165, .16); overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f1d9a5; border-radius: 3px; transition: width .15s; }
      #fail { margin: 18px 24px 0; max-width: 420px; text-align: center; font: 15px/1.35 -apple-system, "Segoe UI", Roboto, sans-serif; color: #c9a36a; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="ld"><h1>MOUSE AT THE BALL</h1><p>tiptoe through the dance</p><div id="bar"><div id="fill"></div></div><div id="fail"></div></div>
    <script>
      var canvas = document.getElementById("unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Generic.data.unityweb",
        frameworkUrl: buildUrl + "/Generic.framework.js.unityweb",
        codeUrl: buildUrl + "/Generic.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Noni Games",
        productName: "Mouse at the Ball",
        productVersion: "1.0.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
      };
      function fail(msg) { document.getElementById("fail").textContent = msg; }
      var s = document.createElement("script");
      s.src = buildUrl + "/Generic.loader.js";
      s.onload = function () {
        createUnityInstance(canvas, config, function (p) { document.getElementById("fill").style.width = Math.round(p * 100) + "%"; })
          .then(function (inst) { window.unityInstance = inst; var l = document.getElementById("ld"); l.style.opacity = "0"; setTimeout(function () { l.remove(); }, 400); canvas.focus(); })
          .catch(function (m) { fail("The game could not start. " + m); });
      };
      s.onerror = function () { fail("The game files could not be loaded. Please reload the page."); };
      document.body.appendChild(s);
      window.addEventListener("keydown", function (e) { if ([32, 37, 38, 39, 40].indexOf(e.keyCode) >= 0) e.preventDefault(); });
      window.addEventListener("pointerdown", function () { canvas.focus(); });
    </script>
  </body>
</html>
