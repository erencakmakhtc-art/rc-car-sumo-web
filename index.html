<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>RC Car Rumble</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #162536; touch-action: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; background: #162536; }
      #rc-loader { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Arial, Helvetica, sans-serif; color: #f4f8ff; background: #162536; }
      #rc-loader .t { font-weight: 900; font-size: 28px; letter-spacing: 2px; margin-bottom: 18px; }
      #rc-loader .t span { color: #42d7f3; }
      #rc-bar { width: 240px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .14); overflow: hidden; }
      #rc-fill { width: 0; height: 100%; background: #ffc93c; border-radius: 4px; transition: width .15s; }
      #rc-rotate { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: none; flex-direction: column; align-items: center; justify-content: center; background: #162536; color: #f4f8ff; font-family: Arial, Helvetica, sans-serif; z-index: 10; }
      #rc-rotate .ph { width: 54px; height: 96px; border: 5px solid #f4f8ff; border-radius: 12px; animation: rcrot 1.6s ease-in-out infinite; }
      @keyframes rcrot { 0%, 20% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      @media (orientation: portrait) and (pointer: coarse) { #rc-rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="rc-loader"><div class="t"><span>RC CAR</span> RUMBLE</div><div id="rc-bar"><div id="rc-fill"></div></div></div>
    <div id="rc-rotate"><div class="ph"></div></div>
    <script>
      var portalInit = Promise.resolve();
      var canvas = document.getElementById("unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Generic.data.unityweb?v=2611111245",
        frameworkUrl: buildUrl + "/Generic.framework.js.unityweb?v=2611111245",
        codeUrl: buildUrl + "/Generic.wasm.unityweb?v=2611111245",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "NONi GAMES",
        productName: "RC Car Rumble",
        productVersion: "1.0.0",
        showBanner: function (msg, type) { if (type == "error") console.error(msg); else console.warn(msg); }
      };
      var loader = document.createElement("script");
      loader.src = buildUrl + "/Generic.loader.js?v=2611111245";
      loader.onload = function () {
        portalInit.catch(function (e) { console.warn("portal sdk:", e); }).then(function () {
          return createUnityInstance(canvas, config, function (p) { document.getElementById("rc-fill").style.width = Math.round(p * 100) + "%"; });
        }).then(function (inst) {
          window.unityInstance = inst;
          document.getElementById("rc-loader").style.display = "none";
        }).catch(function (m) { console.error(m); });
      };
      document.body.appendChild(loader);
    </script>
  </body>
</html>
