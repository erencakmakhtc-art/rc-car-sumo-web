      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; outline: none; background: #f5efdf; }
      /* yükleme ekranı: çizgili defter sayfası, başlık oyunun kendi yazısıyla */
      #kk-loader { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f5efdf;

        transition: opacity .25s; }
      #kk-title { width: min(72vw, 520px); height: auto; overflow: visible; }
      #kk-bar { width: min(52vw, 360px); height: auto; margin-top: 14px; overflow: visible; }
      #kk-bar path { fill: none; stroke-linecap: round; }

    <script>
      var canvas = document.getElementById("unity-canvas");
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Generic.data.unityweb?v=2611121553",
        frameworkUrl: buildUrl + "/Generic.framework.js.unityweb?v=2611121553",
        codeUrl: buildUrl + "/Generic.wasm.unityweb?v=2611121553",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Noni Games",
        productName: "Kickup Kid",
        productVersion: "1.0.0",
        // hata olursa Unity uyarı penceresi açmasın (pencere sayfayı kilitliyor); konsola yazılır
        errorHandler: function (msg, file, line) { console.error("[unity] " + msg + " @" + file + ":" + line); (window.kkErrors = window.kkErrors || []).push("" + msg); return true; },
        // çok yüksek çözünürlükte çizilen piksel sayısı sınırlanır (telefon ve retina ekran)
        devicePixelRatio: Math.max(1, Math.min(window.devicePixelRatio || 1, Math.sqrt(2600000 / Math.max(1, window.innerWidth * window.innerHeight)))),
        showBanner: function (msg, type) { if (type == "error") console.error(msg); else console.warn(msg); }
      };
      var fill = document.getElementById("kk-fill"), len = 300;
      try { len = fill.getTotalLength(); fill.style.strokeDasharray = len; fill.style.strokeDashoffset = len; } catch (e) {}
      var loader = document.createElement("script");
      loader.src = buildUrl + "/Generic.loader.js?v=2611121553";
      loader.onload = function () {
        createUnityInstance(canvas, config, function (p) { fill.style.strokeDashoffset = len * (1 - p); }).then(function (inst) {
          window.unityInstance = inst;
          var l = document.getElementById("kk-loader"); l.style.opacity = 0; setTimeout(function () { l.style.display = "none"; }, 260);
        }).catch(function (m) { console.error(m); });
      };
      document.body.appendChild(loader);
    </script>
